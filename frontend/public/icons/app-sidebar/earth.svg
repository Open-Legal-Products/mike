<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Web files">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.46" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="0.48" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="globeRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#082F49" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="globeSheen" cx="0.3" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globeClip">
      <circle cx="32" cy="31" r="26"/>
    </clipPath>
  </defs>

  <ellipse cx="32" cy="58" rx="20" ry="3.2" fill="#0F172A" opacity="0.2"/>
  <circle cx="32" cy="31" r="26" fill="url(#ocean)" stroke="url(#globeRim)" stroke-width="1.8"/>

  <g clip-path="url(#globeClip)">
