    <path d="M9.2 19.5 L15 14.2 L22.2 11.1 L28.8 13.4 L29.8 17.8 L25.3 20.1 L22.7 24 L18.1 24.8 L16.7 29.1 L19.5 32.7 L18.4 36.4 L14.2 35.1 L11.5 30.5 L8.4 27.1 Z" fill="url(#land)" stroke="#166534" stroke-opacity="0.28" stroke-width="0.8"/>
    <path d="M19.2 36 L25 37.5 L29.5 42 L27.1 47.1 L24.5 55.8 L20.3 51.8 L18.5 45.6 L15.4 40.8 Z" fill="url(#land)" stroke="#166534" stroke-opacity="0.28" stroke-width="0.8"/>

    <!-- Europe, Africa, and Asia -->
    <path d="M32.2 12.1 L38.2 9.4 L47.1 12.4 L54.8 17.7 L58.3 24.6 L53.1 27.6 L48.5 25.2 L44.2 28.6 L39.5 25.8 L35.8 27.1 L32.6 23.3 L28.8 21.5 L30.3 17.4 Z" fill="url(#land)" stroke="#166534" stroke-opacity="0.28" stroke-width="0.8"/>
    <path d="M34.2 27.3 L40.8 27.7 L44.8 33.6 L42.2 40.2 L38.1 48.8 L33.8 44.6 L31.5 37.2 L29.3 32.2 Z" fill="url(#land)" stroke="#166534" stroke-opacity="0.28" stroke-width="0.8"/>
    <path d="M49 42.3 L55.5 43.7 L58 48.5 L53.4 51.6 L48.2 48.4 Z" fill="url(#land)" stroke="#166534" stroke-opacity="0.28" stroke-width="0.8"/>

    <!-- Glass depth and subtle web grid -->
    <g fill="none" stroke="#E0F2FE" stroke-width="1" opacity="0.22">
      <ellipse cx="32" cy="31" rx="13" ry="25"/>
      <path d="M7 31 H57"/>
      <path d="M11 20 C22 24 42 24 53 20"/>
      <path d="M11 42 C22 38 42 38 53 42"/>
    </g>
    <circle cx="32" cy="31" r="26" fill="url(#globeSheen)"/>
    <ellipse cx="18" cy="17" rx="9" ry="5" fill="#FFFFFF" opacity="0.2"/>
  </g>
