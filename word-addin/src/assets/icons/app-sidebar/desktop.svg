<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Desktop files">
  <defs>
    <linearGradient id="laptopFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="0.5" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="laptopDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="laptopRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#334155" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="laptopSheen">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="12" y="12" width="40" height="28" rx="3"/>
    </clipPath>
  </defs>

  <ellipse cx="32" cy="55" rx="26" ry="3.5" fill="#0F172A" opacity="0.18"/>

  <!-- Open display -->
  <rect x="8" y="7" width="48" height="38" rx="6" fill="url(#laptopFrame)" stroke="url(#laptopRim)" stroke-width="1.5"/>
  <rect x="12" y="12" width="40" height="28" rx="3" fill="url(#laptopScreen)" stroke="#2563EB" stroke-opacity="0.28" stroke-width="1"/>
  <g clip-path="url(#screenClip)">
    <ellipse cx="26" cy="13" rx="25" ry="8" fill="url(#laptopSheen)" opacity="0.28"/>
    <ellipse cx="15" cy="25" rx="5" ry="14" fill="url(#laptopSheen)" opacity="0.1"/>
  </g>
  <circle cx="32" cy="9.5" r="1" fill="#475569" opacity="0.7"/>

  <!-- Keyboard deck and front lip -->
  <path d="M8.5 43.5 H55.5 L61 51.5 C62.1 53.1 60.9 55.2 59 55.2 H5 C3.1 55.2 1.9 53.1 3 51.5 L8.5 43.5 Z" fill="url(#laptopDeck)" stroke="url(#laptopRim)" stroke-width="1.5"/>
  <path d="M13 46 H51 L53.7 50 H10.3 L13 46 Z" fill="#64748B" opacity="0.34"/>
  <g fill="#F8FAFC" opacity="0.72">
    <rect x="14" y="46.8" width="4" height="1.2" rx="0.45"/>
    <rect x="19.5" y="46.8" width="4" height="1.2" rx="0.45"/>
    <rect x="25" y="46.8" width="4" height="1.2" rx="0.45"/>
    <rect x="30.5" y="46.8" width="4" height="1.2" rx="0.45"/>
    <rect x="36" y="46.8" width="4" height="1.2" rx="0.45"/>
    <rect x="41.5" y="46.8" width="4" height="1.2" rx="0.45"/>
    <rect x="47" y="46.8" width="3" height="1.2" rx="0.45"/>
  </g>
  <path d="M27 51 H37" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M5 52.2 H59" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.65"/>
</svg>
